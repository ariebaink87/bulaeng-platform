<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BULAENG OS - Classroom Dashboard</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    .wrapper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      width: 100%;
      max-width: 500px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .badge {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-RUNNING { background: #059669; color: #ecfdf5; }
    .status-ENDED { background: #dc2626; color: #fef2f2; }
    .status-DISCONNECTED { background: #475569; color: #cbd5e1; }
    
    .info-group { margin-bottom: 16px; }
    .info-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    .info-value { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    .highlight { color: #38bdf8; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-boot { background: #2563eb; color: white; }
    .btn-boot:hover { background: #1d4ed8; }
    .btn-advance { background: #0d9488; color: white; }
    .btn-advance:hover { background: #0f766e; }
    .btn-ask { background: #8b5cf6; color: white; width: 100%; margin-top: 10px; }
    .btn-ask:hover { background: #7c3aed; }
    button:active { transform: scale(0.98); }

    /* AI Brain Box Styling */
    .ai-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
    }
    .ai-input {
      width: 100%;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      outline: none;
    }
    .ai-input:focus { border-color: #8b5cf6; }
    .ai-response {
      margin-top: 12px;
      padding: 10px;
      background: #1e293b;
      border-left: 3px solid #8b5cf6;
      border-radius: 4px;
      font-size: 13px;
      color: #cbd5e1;
      min-height: 40px;
      white-space: pre-wrap; /* Format paragraf AI rapi */
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- OS Control Panel -->
    <div class="container">
      <div class="header">
        <h2>📱 BULAENG OS</h2>
        <span id="status" class="badge status-DISCONNECTED">OFFLINE</span>
      </div>

      <div class="info-group">
        <div class="info-label">Session ID</div>
        <div id="session" class="info-value">-</div>
      </div>

      <div class="info-group">
        <div class="info-label">Momen Saat Ini</div>
        <div id="moment" class="info-value highlight">Menunggu Koneksi...</div>
      </div>

      <div class="info-group">
        <div class="info-label">Progress Kelas</div>
        <div id="progress" class="info-value">0%</div>
      </div>

      <div class="actions">
        <button class="btn-boot" onclick="bootEngine()">🚀 Boot Engine</button>
        <button class="btn-advance" onclick="advanceMoment()">⏭️ Lanjut Momen</button>
      </div>

      <!-- Module Brain AI integration -->
      <div class="ai-box">
        <div class="info-label">🧠 BULAENG Brain AI Assistant</div>
        <input 
          type="text" 
          id="aiPrompt" 
          class="ai-input" 
          placeholder="Tanyakan saran instruksi kelas..." 
          value="Bagaimana cara mencairkan suasana kelas?"
          onkeydown="if(event.key === 'Enter') askBrain()"
        >
        <button id="btnAsk" class="btn-ask" onclick="askBrain()">✨ Tanya AI Brain</button>
        <div id="aiResponse" class="ai-response">Jawaban AI akan muncul di sini...</div>
      </div>
    </div>
  </div>

  <script>
    // Koneksi Socket.io ke server
    const socket = io();

    socket.on('connect', () => {
      console.log('⚡ Terhubung ke Mesin BULAENG OS!');
      const statusEl = document.getElementById('status');
      if (statusEl.innerText === 'OFFLINE') {
        statusEl.innerText = 'ONLINE';
        statusEl.className = 'badge status-RUNNING';
      }
    });

    socket.on('disconnect', () => {
      const statusEl = document.getElementById('status');
      statusEl.innerText = 'OFFLINE';
      statusEl.className = 'badge status-DISCONNECTED';
    });

    socket.on('state_changed', (res) => {
      const data = res.data || res;
      if (data.session_id) document.getElementById('session').innerText = data.session_id;
      if (data.current_moment) document.getElementById('moment').innerText = data.current_moment;
      if (data.progress !== undefined) document.getElementById('progress').innerText = data.progress + '%';
      
      if (data.system_status) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = data.system_status;
        statusEl.className = `badge status-${data.system_status}`;
      }
    });

    async function bootEngine() {
      try {
        await fetch('/api/v1/boot', { method: 'POST' });
      } catch (err) {
        console.error('Gagal boot engine:', err);
      }
    }

    async function advanceMoment() {
      try {
        await fetch('/api/v1/advance', { method: 'POST' });
      } catch (err) {
        console.error('Gagal advance moment:', err);
      }
    }

    // Fungsi Komunikasi ke API AI Brain
    async function askBrain() {
      const promptInput = document.getElementById('aiPrompt').value.trim();
      const currentMoment = document.getElementById('moment').innerText;
      const responseEl = document.getElementById('aiResponse');
      const btnAsk = document.getElementById('btnAsk');
      
      if (!promptInput) return;

      // Status loading & mematikan tombol sementara
      btnAsk.disabled = true;
      btnAsk.innerText = "⏳ Sedang berpikir...";
      responseEl.innerText = "⏳ Sedang menghubungi BULAENG Brain AI...";

      try {
        const res = await fetch('/api/v1/brain/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: promptInput, // Key disesuaikan dengan validasi backend ('prompt')
            currentMoment: currentMoment 
          })
        });
        
        const result = await res.json();

        if (result.success) {
          // Menangani fleksibilitas struktur respons backend
          const brainText = result.data?.prompt || result.data?.response || result.response;
          responseEl.innerText = typeof brainText === 'object' ? JSON.stringify(brainText, null, 2) : (brainText || "Tidak ada respon dari server.");
        } else {
          responseEl.innerText = `❌ Error: ${result.error || 'Terjadi kesalahan.'}`;
        }
      } catch (err) {
        console.error(err);
        responseEl.innerText = "❌ Gagal terhubung ke Brain API.";
      } finally {
        // Kembalikan tombol ke keadaan semula
        btnAsk.disabled = false;
        btnAsk.innerText = "✨ Tanya AI Brain";
      }
    }
  </script>

</body>
</html>
